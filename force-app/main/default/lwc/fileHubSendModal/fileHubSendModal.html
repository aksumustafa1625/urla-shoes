<template>
    <!-- SLDS modal — opens centered with backdrop -->
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
        <div class="slds-modal__container">

            <!-- HEADER -->
            <header class="slds-modal__header">
                <lightning-button-icon
                    icon-name="utility:close"
                    alternative-text="Close"
                    class="slds-modal__close"
                    onclick={handleClose}>
                </lightning-button-icon>
                <h2 class="slds-modal__title slds-hyphenate">Send File</h2>
            </header>

            <!-- BODY -->
            <div class="slds-modal__content slds-p-around_medium fhsm-body">

                <!-- RECIPIENT -->
                <div class="slds-form-element">
                    <label class="slds-form-element__label">
                        <abbr class="slds-required" title="required">*</abbr>
                        Recipient
                    </label>
                    <c-file-hub-user-lookup
                        selected-name={recipientName}
                        onselect={handleRecipientSelect}
                        onclear={handleRecipientClear}>
                    </c-file-hub-user-lookup>
                </div>

                <!-- CATEGORY -->
                <lightning-combobox
                    name="category"
                    label="Category"
                    required
                    value={category}
                    options={categoryOptions}
                    onchange={handleCategoryChange}
                    class="slds-m-top_small">
                </lightning-combobox>

                <!-- LINK TYPE -->
                <lightning-combobox
                    name="linkType"
                    label="Link to record"
                    value={linkType}
                    options={linkTypeOptions}
                    onchange={handleLinkTypeChange}
                    class="slds-m-top_small">
                </lightning-combobox>

                <!-- RESELLER PICKER (custom — shows top 10 on click, no typing required) -->
                <template if:true={showResellerPicker}>
                    <div class="slds-form-element slds-m-top_small">
                        <label class="slds-form-element__label">Reseller</label>
                        <c-file-hub-record-lookup
                            lookup-type="reseller"
                            placeholder="Click to see resellers..."
                            onselect={handleResellerSelect}
                            onclear={handleResellerClear}>
                        </c-file-hub-record-lookup>
                    </div>
                </template>

                <!-- LOAN PICKER -->
                <template if:true={showLoanPicker}>
                    <div class="slds-form-element slds-m-top_small">
                        <label class="slds-form-element__label">Loan</label>
                        <c-file-hub-record-lookup
                            lookup-type="loan"
                            placeholder="Click to see loans..."
                            onselect={handleLoanSelect}
                            onclear={handleLoanClear}>
                        </c-file-hub-record-lookup>
                    </div>
                </template>

                <!-- MESSAGE -->
                <lightning-textarea
                    name="message"
                    label="Message (optional)"
                    placeholder="Add a note for the recipient..."
                    max-length="2000"
                    value={message}
                    onchange={handleMessageChange}
                    class="slds-m-top_small">
                </lightning-textarea>

                <!-- FILE UPLOAD -->
                <div class="slds-form-element slds-m-top_small">
                    <label class="slds-form-element__label">
                        <abbr class="slds-required" title="required">*</abbr>
                        File
                    </label>
                    <template if:false={hasUploadedFile}>
                        <lightning-file-upload
                            label=""
                            name="modalUploader"
                            accept={acceptedFormats}
                            record-id={currentUserId}
                            onuploadfinished={handleUploadFinished}>
                        </lightning-file-upload>
                    </template>
                    <template if:true={hasUploadedFile}>
                        <div class="fhsm-uploaded">
                            <lightning-icon icon-name="utility:file" size="small" alternative-text="File"></lightning-icon>
                            <span class="fhsm-uploaded-name">{uploadedFileName}</span>
                            <lightning-icon icon-name="utility:check" size="x-small" alternative-text="Uploaded" class="fhsm-uploaded-check"></lightning-icon>
                        </div>
                    </template>
                </div>

            </div>

            <!-- FOOTER -->
            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleClose}></lightning-button>
                <lightning-button
                    variant="brand"
                    label={sendButtonLabel}
                    disabled={isSubmitting}
                    onclick={handleSend}
                    class="slds-m-left_x-small">
                </lightning-button>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
